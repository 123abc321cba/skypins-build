name: Build SkyPins IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle Identifier'
        default: 'com.skypins.bridge'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          sw_vers
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SkyPins.xcodeproj \
            -scheme SkyPins \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            CONFIGURATION_BUILD_DIR=./build/Release-iphoneos \
            build 2>&1 | tee build.log | tail -n 120

      - name: Verify binary
        run: |
          APP=$(find ./build -maxdepth 3 -name "SkyPins.app" -type d | head -n 1)
          echo "APP=$APP"
          ls -la "$APP"
          file "$APP/SkyPins"
          lipo -info "$APP/SkyPins" || true
          otool -l "$APP/SkyPins" | grep -A4 -m1 LC_BUILD_VERSION || true

      - name: Ad-hoc sign and package IPA
        run: |
          set -e
          APP=$(find ./build -maxdepth 3 -name "SkyPins.app" -type d | head -n 1)
          rm -rf ./Payload ./SkyPins.ipa
          mkdir -p ./Payload
          cp -R "$APP" ./Payload/
          # 重签嵌入式内容 & 主程序为 ad-hoc（模拟器/USB 侧载或再自行重签）
          codesign --force --sign - --timestamp=none "Payload/SkyPins.app" || true
          codesign -dv --verbose=4 "Payload/SkyPins.app" 2>&1 | head -n 20 || true
          zip -qry SkyPins.ipa ./Payload
          ls -la SkyPins.ipa
          shasum -a 256 SkyPins.ipa
          unzip -l SkyPins.ipa | head -n 30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SkyPins-ipa
          path: |
            SkyPins.ipa
            build.log
          retention-days: 14

      - name: Upload dSYM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkyPins-dsym
          path: build/**/*.dSYM
          if-no-files-found: ignore
          retention-days: 7
